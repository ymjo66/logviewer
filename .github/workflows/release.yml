name: Build & Release

# Log viewer releases use "logviewer-vX.Y.Z" tags and are NOT marked "Latest".
# Plain "vX.Y.Z" / Latest releases in this repository belong to XDroneGCS, whose
# updater installs whatever .exe the Latest release carries.
#
# - Actions > Build & Release > Run workflow (version, notes): builds the exe and
#   publishes release logviewer-v<version>.
# - A release published by hand with a logviewer-v* tag gets the exe attached.
# - Pull requests: build check only (exe available as a workflow artifact).

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (예: 1.0.1)'
        required: true
        type: string
      notes:
        description: '업데이트 내용 - 앱의 업데이트 안내 창에 표시됩니다 (비우면 변경 내역 자동 생성)'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.version || github.ref }}

env:
  TAG_PREFIX: logviewer-v
  ASSET_NAME: X_Drone_Log_Viewer.exe

jobs:
  build:
    # Releases published with other tags (e.g. XDroneGCS "v1.0.1") are not ours
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'logviewer-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) v="${INPUT_VERSION#"$TAG_PREFIX"}"; v="${v#v}" ;;
            release) v="${RELEASE_TAG#"$TAG_PREFIX"}" ;;
            *) v="$(python -c 'from version import __version__; print(__version__)')" ;;
          esac
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전 형식이 올바르지 않습니다: '$v' (예: 1.0.1)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_PREFIX$v" >> "$GITHUB_OUTPUT"

      - name: Check the release tag is unused
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG 릴리즈(태그)가 이미 있습니다. 더 높은 버전을 입력해 주세요."
            exit 1
          fi

      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf "# Generated by the release workflow\n__version__ = '%s'\nUPDATE_REPO = '%s'\n" "$VERSION" "$GITHUB_REPOSITORY" > version.py
          cat version.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --noconfirm --clean X_Drone_Log_Viewer.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: X_Drone_Log_Viewer-${{ steps.version.outputs.version }}
          path: dist/${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            gh release upload "$TAG" "dist/$ASSET_NAME" --clobber
          else
            args=(--title "X Drone Log Viewer v$VERSION" --target "$GITHUB_SHA" --latest=false)
            if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); else args+=(--generate-notes); fi
            gh release create "$TAG" "dist/$ASSET_NAME" "${args[@]}"
          fi
