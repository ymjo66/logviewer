name: Build and release
on:
  push:
    branches: [logviewer]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - name: Check native executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path dist/LogViewer.exe) -ArgumentList '--self-test','artifacts/exe-self-test.json' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Native self test failed' }
          Get-Content artifacts/exe-self-test.json
      - name: Prepare matching source
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/source-archive.cjs
      - name: Verify tag and publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          node scripts/publish-release.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed' }
