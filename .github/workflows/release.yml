name: Build and release
on:
  push:
    branches: [logviewer]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: logviewer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - name: Check executable and actual browser pipeline
        shell: pwsh
        run: |
          foreach ($mode in @('self-test','browser-self-test')) {
            $report = "artifacts/$mode.json"
            $p = Start-Process -FilePath (Resolve-Path dist/LogViewer.exe) -ArgumentList "--$mode",$report -WindowStyle Hidden -PassThru
            if (-not $p.WaitForExit(150000)) { $p.Kill(); throw "$mode timed out" }
            if (Test-Path $report) { Get-Content $report }
            if ($p.ExitCode -ne 0) { throw "$mode failed" }
          }
      - name: Prepare matching source
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/source-archive.cjs
      - name: Verify tag and publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          node scripts/publish-release.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed' }

